databaseChangeLog:
- changeSet:
    id: 1
    author: Peyman Abdullali
    changes:
      - createTable:
          tableName: products
          columns:
            - column:
                name: id
                type: BIGSERIAL
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: name
                type: VARCHAR(255)
                autoIncrement: true
                constraints:
                  nullable: false
